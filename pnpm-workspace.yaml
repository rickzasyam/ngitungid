allowBuilds:
  # @google/genai & protobufjs tidak butuh build script — SDK jalan tanpa itu
  # (ekstraksi PDF terverifikasi). false = jangan jalankan postinstall-nya.
  '@google/genai': false
  # postinstall @sentry/cli mengunduh binary sentry-cli yang HANYA dipakai untuk
  # upload source map saat build. Kita tidak melakukannya (tanpa auth token) —
  # capture error tidak butuh binary itu. Set true kalau nanti source map
  # upload diaktifkan.
  '@sentry/cli': false
  esbuild: true
  msw: true
  protobufjs: false
  sharp: true
  # unrs-resolver = native (napi) module resolver yang dipakai eslint-config-next
  # (plugin import). Postinstall-nya melink binary native prebuilt untuk platform
  # ini; tanpa itu ESLint/plugin import gagal load. Dep resmi dari config Next,
  # jadi build-nya di-allow supaya `pnpm lint` jalan.
  unrs-resolver: true
